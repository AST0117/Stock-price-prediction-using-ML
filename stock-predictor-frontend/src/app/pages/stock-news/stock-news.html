<div class="page">
  <h2>Stock News</h2>

  <div class="search-bar autocomplete-wrap">
    <input
      [(ngModel)]="ticker"
      (input)="onTickerInput()"
      (focus)="showSuggestions = suggestions.length > 0"
      (blur)="hideSuggestions()"
      placeholder="e.g. AAPL, Apple, Tata Motors..."
      (keyup.enter)="search()"
      autocomplete="off"
    />
    <button (click)="search()">Search</button>

    <div *ngIf="showSuggestions" class="suggestions-dropdown">
      <div *ngFor="let s of suggestions" class="suggestion-item" (mousedown)="selectSuggestion(s)">
        <strong>{{ s.symbol }}</strong> — {{ s.name }} <span class="exchange-tag">{{ s.exchange }}</span>
      </div>
    </div>
  </div>

  <p *ngIf="loading">Loading news...</p>
  <p *ngIf="error" class="error">{{ error }}</p>
  <p *ngIf="!loading && articles.length === 0 && !error">No recent news found.</p>

  <div class="news-list">
    <a *ngFor="let a of articles" [href]="a.url" target="_blank" class="news-card">
      <h4>{{ a.title }}</h4>
      <p>{{ a.description }}</p>
      <span class="meta">{{ a.source }} • {{ a.published_at | slice:0:10 }}</span>
    </a>
  </div>
</div>
