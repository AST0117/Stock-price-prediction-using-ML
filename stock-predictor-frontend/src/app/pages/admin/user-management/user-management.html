<div class="page">
  <div class="page-header">
    <h2>User Management</h2>
    <button (click)="openCreate()">+ New User</button>
  </div>

  <p *ngIf="error" class="error">{{ error }}</p>
  <p *ngIf="loading">Loading users...</p>

  <table *ngIf="!loading" class="user-table">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td><span class="badge" [ngClass]="u.role">{{ u.role }}</span></td>
        <td>{{ u.created_at | slice:0:10 }}</td>
        <td>
          <button (click)="openEdit(u)">Edit</button>
          <button (click)="remove(u)" class="danger">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="showForm" class="modal-overlay">
    <div class="modal">
      <h3>{{ editingUser ? 'Edit User' : 'Create User' }}</h3>
      <input [(ngModel)]="form.name" placeholder="Name" />
      <input [(ngModel)]="form.email" placeholder="Email" type="email" />
      <input [(ngModel)]="form.password" placeholder="{{ editingUser ? 'New password (optional)' : 'Password' }}" type="password" />
      <select [(ngModel)]="form.role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
      <div class="modal-actions">
        <button (click)="save()">Save</button>
        <button (click)="cancel()" class="secondary">Cancel</button>
      </div>
    </div>
  </div>
</div>
