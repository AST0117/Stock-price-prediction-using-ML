<div class="shell">
  <aside class="sidebar">
    <h3>📈 Stock Predictor</h3>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active-link">Home</a>
      <a routerLink="/dashboard/predictor" routerLinkActive="active-link">Predict Prices</a>
      <a routerLink="/dashboard/live-prices" routerLinkActive="active-link">Live Prices</a>
      <a routerLink="/dashboard/news" routerLinkActive="active-link">Stock News</a>
      <a routerLink="/dashboard/currency" routerLinkActive="active-link">Currency Converter</a>
      <a routerLink="/dashboard/education" routerLinkActive="active-link">Learn Stocks</a>
      <a routerLink="/dashboard/tickers" routerLinkActive="active-link">Download Tickers</a>
      <a routerLink="/dashboard/profile" routerLinkActive="active-link">My Profile</a>
      <ng-container *ngIf="auth.isAdmin()">
        <hr />
        <a routerLink="/dashboard/admin/users" routerLinkActive="active-link">Manage Users</a>
        <a routerLink="/dashboard/admin/emails" routerLinkActive="active-link">Trigger Emails</a>
      </ng-container>
    </nav>
    <button (click)="logout()">Logout</button>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <h2>{{ currentPageTitle }}</h2>
      <div class="topbar-right">
        <span class="role-badge" [ngClass]="auth.isAdmin() ? 'role-admin' : 'role-user'">
          {{ auth.getUser()?.role }}
        </span>
        <div class="user-avatar">{{ getInitials() }}</div>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
